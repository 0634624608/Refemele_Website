<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Cybersecurity portfolio of Refemele Mabilo, IT student at Vaal University of Technology.">
<title>Refemele Mabilo Portfolio</title>
<link id="fontlink" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style id="pagecss">
/* Layout: sticky top nav, single column of sections inside a 1080px wrap; hero is a two-column text + terminal card.
   Palette: charcoal with a green bias, one muted green accent, amber only for "in progress". */
:root{
  --bg:#0a0d0c; --bg-2:#0d1110; --surface:#121816; --surface-2:#171e1b;
  --line:#212a26; --line-2:#2d3a34;
  --fg:#e9eeeb; --fg-2:#b6c0bb; --muted:#808c87;
  --accent:#4cc38a; --accent-2:#2e8e63; --accent-bg:rgba(76,195,138,.10);
  --warn:#d6a443; --warn-bg:rgba(214,164,67,.11);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin-inline:auto;padding-inline:20px}
a{color:inherit}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
section{padding-block:76px;border-top:1px solid var(--line);scroll-margin-top:64px}
section#home{border-top:0;padding-block:64px 80px}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
h2{font-size:clamp(1.55rem,3.2vw,2.1rem);line-height:1.2;font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin-bottom:12px}
.lead{color:var(--fg-2);max-width:62ch}
.sec-head{margin-bottom:36px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(10,13,12,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-block:10px}
.brand{font:500 14px/1 var(--mono);color:var(--fg);text-decoration:none;white-space:nowrap}
.brand b{color:var(--accent);font-weight:500}
nav{flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav ul{display:flex;gap:4px;justify-content:flex-end;white-space:nowrap}
nav a{display:block;padding:8px 10px;border-radius:6px;font-size:14px;color:var(--fg-2);text-decoration:none;transition:color .15s,background .15s}
nav a:hover{color:var(--fg);background:var(--surface)}
a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:48px;align-items:center}
.status{display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px;font:400 13px/1.4 var(--mono);color:var(--fg-2);border:1px solid var(--line-2);background:var(--surface);padding:7px 12px;border-radius:999px;margin-bottom:26px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(76,195,138,.5);animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(76,195,138,0)}100%{box-shadow:0 0 0 0 rgba(76,195,138,0)}}
h1{font-size:clamp(2.4rem,6.4vw,4.1rem);line-height:1.04;font-weight:600;letter-spacing:-.025em;text-wrap:balance}
.role{font:500 clamp(1rem,2.2vw,1.2rem)/1.3 var(--mono);color:var(--accent);margin:14px 0 20px}
.intro{color:var(--fg-2);max-width:56ch;font-size:1.06rem}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:8px;border:1px solid var(--line-2);background:transparent;color:var(--fg);font:500 15px/1 var(--sans);text-decoration:none;cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.btn:hover{border-color:var(--accent-2);background:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#04140b}
.btn.primary:hover{background:#63d3a0;border-color:#63d3a0}
.term{background:#070a09;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;font:400 13.5px/1.75 var(--mono);min-width:0}
.term-h{display:flex;align-items:center;gap:7px;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}
.term-h i{width:9px;height:9px;border-radius:50%;background:var(--line-2)}
.term-h span{margin-left:8px}
.term-b{padding:16px 18px 20px;overflow-wrap:anywhere}
.term-b .c{color:var(--accent)}
.term-b .o{color:var(--fg-2);padding-left:14px;display:block}
.term-b .g{display:block;height:6px}
.cur{display:inline-block;width:8px;height:15px;background:var(--accent);vertical-align:-2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* about */
.about{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px}
.about p+p{margin-top:16px}
.about p{color:var(--fg-2)}
.focus{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start}
.focus li{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;font-size:14.5px;display:flex;justify-content:space-between;gap:8px}
.focus li.addli{padding:0;border:0;background:none}

/* journey */
.tl{max-width:720px;position:relative}
.tl li{position:relative;padding:0 0 30px 40px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:11px;top:26px;bottom:-2px;width:1px;background:var(--line-2)}
.tl li:last-child::before{display:none}
.node{position:absolute;left:0;top:4px;width:23px;height:23px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--bg);display:grid;place-items:center}
.node::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.tl .s-completed .node{border-color:var(--accent);background:var(--accent-bg)}
.tl .s-completed .node::after{background:var(--accent)}
.tl .s-current .node{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-bg)}
.tl .s-current .node::after{background:var(--accent);width:9px;height:9px}
.tl .s-building .node{border-color:var(--warn)}
.tl .s-building .node::after{background:var(--warn)}
.tl .s-future .node{border-style:dashed}
.tl-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.tl-t{font-weight:600;font-size:1.05rem}
.tl-n{color:var(--muted);font-size:14.5px;margin-top:2px}
.tl .s-future .tl-t{color:var(--fg-2)}

/* badges */
.badge{display:inline-block;font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:5px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.badge.s-completed,.badge.s-current{color:var(--accent);border-color:var(--accent-2);background:var(--accent-bg)}
.badge.s-in-progress,.badge.s-building{color:var(--warn);border-color:rgba(214,164,67,.4);background:var(--warn-bg)}

/* projects */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--accent-2);transform:translateY(-2px)}
.card.cap{grid-column:1/-1;border-style:dashed;border-color:var(--line-2);background:var(--bg-2)}
.p-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.p-num{font:500 12px/1 var(--mono);letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.card h3{font-size:1.2rem;line-height:1.25;font-weight:600}
.card .d{color:var(--fg-2);font-size:15px}
.lbl{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:1.3;padding:5px 9px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--fg-2)}
.chip.m{font-family:var(--mono);font-size:12px;color:var(--fg)}
.card .btn{align-self:flex-start;margin-top:auto;padding:10px 16px;font-size:14px}
.card .btn::after{content:"→";color:var(--accent)}

/* skills */
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}
.skills .card:hover{transform:none}
.skills h3{font:500 13px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.skills .chips{gap:7px}

/* experience */
.exp{max-width:820px;display:block}
.exp .meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:14px;margin:6px 0 16px}
.exp .card:hover,.cert:hover{transform:none}
.bul li{position:relative;padding-left:20px;color:var(--fg-2);display:flex;justify-content:space-between;gap:8px}
.bul li+li{margin-top:6px}
.bul li::before{content:"›";position:absolute;left:0;color:var(--accent);font-family:var(--mono)}
.ach{margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}
.empty{color:var(--muted);font-style:italic;font-size:14.5px}

/* certs */
.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.cert{display:flex;flex-direction:column;gap:10px}
.cert h3{font-size:1.05rem;font-weight:600;line-height:1.3}
.cert p{color:var(--muted);font-size:14px}
.cert .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}

/* lab */
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:22px}
.fn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;position:relative;min-width:0}
.fn b{display:block;font:500 14px/1.3 var(--mono);color:var(--fg);overflow-wrap:anywhere}
.fn span{display:block;font-size:13px;color:var(--muted);margin-top:6px;line-height:1.4}
.fn:not(:last-child)::after{content:"→";position:absolute;right:-12px;top:50%;transform:translate(50%,-50%);color:var(--accent);font-family:var(--mono);z-index:1;background:var(--bg);padding:0 2px;line-height:1}
.note{border-left:2px solid var(--accent-2);padding:4px 0 4px 16px;color:var(--fg-2);max-width:68ch}

/* github + contact */
.gh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:24px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px}
.gh p{color:var(--fg-2);max-width:56ch}
.contacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.ct{display:flex;flex-direction:column;gap:10px}
.ct .v{font:400 14px/1.5 var(--mono);overflow-wrap:anywhere;color:var(--fg)}
.ct .v.ph{color:var(--muted)}
.ct .v a{color:var(--accent);text-decoration:none}
.ct .v a:hover{text-decoration:underline}
.ct .btn{align-self:flex-start;padding:8px 12px;font-size:13px}
footer{border-top:1px solid var(--line);padding-block:28px 110px;color:var(--muted);font:400 13px/1.5 var(--mono)}

/* modal */
.ov{position:fixed;inset:0;z-index:60;background:rgba(3,5,4,.78);display:grid;place-items:center;padding:16px}
.panel{background:var(--surface);border:1px solid var(--line-2);border-radius:12px;width:min(780px,100%);max-height:calc(100% - 8px);overflow-y:auto;padding:28px;display:flex;flex-direction:column;gap:22px}
.panel .x-close{align-self:flex-end;margin:-8px -8px -10px 0}
.panel h3{font-size:1.5rem;line-height:1.2;font-weight:600}
.panel h4{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.prose{color:var(--fg-2);white-space:pre-line;min-height:1.4em}
.ev{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px}
.ev figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.ev img{width:100%;border-radius:8px;border:1px solid var(--line-2);display:block}
.ev figcaption{font-size:13px;color:var(--muted)}

/* edit mode */
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;max-width:calc(100% - 32px);background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.bar button,.mini{font:500 13px/1 var(--sans);color:var(--fg);background:transparent;border:1px solid var(--line-2);border-radius:7px;padding:9px 12px;cursor:pointer}
.bar button:hover,.mini:hover{border-color:var(--accent-2)}
.bar .primary{background:var(--accent);border-color:var(--accent);color:#04140b}
.bar .dirty{font:400 12px/1 var(--mono);color:var(--muted);padding:0 6px}
.bar .dirty.on{color:var(--warn)}
.editing [data-p]:not(select){outline:1px dashed var(--line-2);outline-offset:3px;border-radius:3px;cursor:text;min-width:1ch}
.editing [data-p]:not(select):focus{outline:1px solid var(--accent);background:var(--accent-bg)}
.editing [data-p]:empty::before{content:attr(data-ph);color:var(--muted)}
.sel{font:500 11px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;background:var(--surface-2);color:var(--fg);border:1px solid var(--line-2);border-radius:5px;padding:5px 6px}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 2px}
.x:hover{color:var(--warn)}
.addb{font:500 12px/1 var(--mono);color:var(--accent);background:none;border:1px dashed var(--accent-2);border-radius:6px;padding:6px 10px;cursor:pointer}
.hint{background:var(--warn-bg);border:1px solid rgba(214,164,67,.35);color:var(--fg-2);border-radius:8px;padding:10px 14px;font-size:14px;margin-bottom:20px}
.filebtn{position:relative;display:inline-block;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
#toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:80;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:10px 16px;font-size:14px;max-width:calc(100% - 32px)}

@media (max-width:860px){
  .hero,.about{grid-template-columns:minmax(0,1fr);gap:36px}
  .flow{grid-template-columns:minmax(0,1fr)}
  .fn:not(:last-child)::after{content:"↓";right:auto;left:24px;top:auto;bottom:-14px;transform:translate(0,50%)}
  section{padding-block:56px}
  .brand{display:none}
  nav ul{justify-content:flex-start}
}
@media (max-width:480px){
  .focus{grid-template-columns:minmax(0,1fr)}
  .panel{padding:20px}
  .gh{padding:22px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .dot,.cur{animation:none}
  .card,.btn{transition:none}
}
</style>
</head>

<script id="code">
(function(){
var S=JSON.parse(document.getElementById('state').textContent);
var app=document.getElementById('app');
var editing=false,dirty=false,canEdit=false,openIdx=-1,toastT=0;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function get(p){return p.split('.').reduce(function(o,k){return o==null?o:o[k]},S)}
function set(p,v){var k=p.split('.'),l=k.pop(),o=k.reduce(function(a,b){return a[b]},S);o[l]=v}
function slug(s){return String(s).toLowerCase().replace(/[^a-z]+/g,'-')}
function ed(p,tag,cls,ph,ml){var v=get(p);return '<'+tag+' class="'+(cls||'')+'" data-p="'+p+'"'+(ml?' data-ml="1"':'')+' data-ph="'+esc(ph||'Add text')+'">'+esc(v)+'</'+tag+'>'}
function status(p,opts){var v=get(p);if(editing){return '<select class="sel" data-p="'+p+'" aria-label="Status">'+opts.map(function(o){return '<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'}return '<span class="badge s-'+slug(v)+'">'+esc(v)+'</span>'}
function chips(p,cls){var a=get(p);return a.map(function(t,i){return '<li class="chip '+(cls||'')+'"><span data-p="'+p+'.'+i+'" data-ph="Item">'+esc(t)+'</span>'+(editing?'<button class="x" data-act="rm" data-arr="'+p+'" data-i="'+i+'" aria-label="Remove">×</button>':'')+'</li>'}).join('')+(editing?'<li><button class="addb" data-act="add" data-arr="'+p+'" data-tpl="New item">+ add</button></li>':'')}

function header(){var l=[['home','Home'],['about','About'],['journey','Journey'],['projects','Projects'],['skills','Skills'],['experience','Experience'],['certifications','Certifications'],['contact','Contact']];
return '<header class="top"><div class="wrap"><a class="brand" href="#home"><b>~/</b>refemele.mabilo</a><nav aria-label="Main"><ul>'+l.map(function(x){return '<li><a href="#'+x[0]+'">'+x[1]+'</a></li>'}).join('')+'</ul></nav></div></header>'}

function hero(){var P=S.profile;
return '<section id="home"><div class="wrap"><div class="hero"><div>'+
'<div class="status"><span class="dot"></span><span>Currently building →</span>'+ed('profile.status','span','','Focus areas')+'</div>'+
'<h1>'+ed('profile.name','span','','Your name')+'</h1>'+
ed('profile.title','p','role','Title')+
ed('profile.intro','p','intro','Introduction',true)+
'<div class="cta"><a class="btn primary" href="#projects">View My Projects</a><a class="btn" href="#contact">Contact Me</a></div></div>'+
'<div class="term" aria-hidden="true"><div class="term-h"><i></i><i></i><i></i><span>session: lab-01</span></div><div class="term-b">'+
'<span class="c">$ whoami</span><span class="o">'+esc(P.name.toLowerCase().replace(/\s+/g,'.'))+'</span><span class="g"></span>'+
'<span class="c">$ cat role.txt</span><span class="o">'+esc(P.title)+'</span><span class="g"></span>'+
'<span class="c">$ cat focus.txt</span><span class="o">networking</span><span class="o">linux</span><span class="o">security analysis</span><span class="g"></span>'+
'<span class="c">$ lab --scope</span><span class="o">authorized environments only</span><span class="g"></span>'+
'<span class="c">$ </span><span class="cur"></span></div></div></div></div></section>'}

function about(){return '<section id="about"><div class="wrap"><div class="sec-head"><div class="eyebrow">~/about</div><h2>Building security skills on a networking foundation</h2></div><div class="about"><div>'+ed('profile.about1','p','','About paragraph',true)+ed('profile.about2','p','','About paragraph',true)+'</div><ul class="focus">'+chips('profile.focus','').replace(/class="chip /g,'class="').replace(/<li class="\s*"/g,'<li')+'</ul></div></div></section>'}

function journey(){return '<section id="journey"><div class="wrap"><div class="sec-head"><div class="eyebrow">~/journey</div><h2>Cybersecurity journey</h2><p class="lead">The path I am following, from IT fundamentals toward a security engineering career. Stages are marked by where I actually am, not where I plan to be.</p></div><ol class="tl">'+S.journey.map(function(j,i){var b='journey.'+i;return '<li class="s-'+slug(j.state)+'"><span class="node"></span><div class="tl-h">'+ed(b+'.title','span','tl-t','Stage')+status(b+'.state',['Completed','Building','Current','Future'])+'</div>'+ed(b+'.note','p','tl-n','Short note')+'</div></li>'}).join('')+'</ol></div></section>'}

function projects(){return '<section id="projects"><div class="wrap"><div class="sec-head"><div class="eyebrow">~/projects</div><h2>My 8 core security projects</h2><p class="lead">Eight structured projects, each building on the last. Evidence, methodology and findings are added to each project page as the work is completed.</p></div><div class="grid">'+S.projects.map(function(p,i){var b='projects.'+i;return '<article class="card'+(p.cap?' cap':'')+'"><div class="p-top"><span class="p-num">Project '+esc(p.num)+(p.cap?' · Final stage':'')+'</span>'+status(b+'.status',['Planned','In Progress','Completed'])+'</div>'+ed(b+'.title','h3','','Project title')+ed(b+'.desc','p','d','Description',true)+'<div><div class="lbl">Skills demonstrated</div><ul class="chips">'+chips(b+'.skills','')+'</ul></div><div><div class="lbl">Tools used</div><ul class="chips">'+chips(b+'.tools','m')+'</ul></div><button class="btn" data-act="open" data-i="'+i+'">View Project</button></article>'}).join('')+'</div></div></section>'}

function skills(){return '<section id="skills"><div class="wrap"><div class="sec-head"><div class="eyebrow">~/skills</div><h2>Skills</h2><p class="lead">Grouped by area. No percentages, because they say little about what I can actually do. The projects show that.</p></div><div class="skills">'+S.skills.map(function(c,i){return '<div class="card"><h3>'+ed('skills.'+i+'.cat','span','','Category')+'</h3><ul class="chips">'+chips('skills.'+i+'.items','')+'</ul></div>'}).join('')+'</div></div></section>'}

function experience(){var b='experience',E=S.experience;
var pts=E.points.map(function(t,i){return '<li>'+ed(b+'.points.'+i,'span','','Point')+(editing?'<button class="x" data-act="rm" data-arr="'+b+'.points" data-i="'+i+'" aria-label="Remove">×</button>':'')+'</li>'}).join('')+(editing?'<li><button class="addb" data-act="add" data-arr="'+b+'.points" data-tpl="New point">+ add</button></li>':'');
var ach=E.achievements.map(function(t,i){return '<li>'+ed(b+'.achievements.'+i,'span','','Achievement')+(editing?'<button class="x" data-act="rm" data-arr="'+b+'.achievements" data-i="'+i+'" aria-label="Remove">×</button>':'')+'</li>'}).join('')+(editing?'<li><button class="addb" data-act="add" data-arr="'+b+'.achievements" data-tpl="New achievement">+ add</button></li>':'');
return '<section id="experience"><div class="wrap"><div class="sec-head"><div class="eyebrow">~/experience</div><h2>Experience</h2></div><div class="exp"><div class="card"><div>'+ed(b+'.role','h3','','Role')+'<div class="meta">'+ed(b+'.org','span','','Organisation')+ed(b+'.dates','span','','Dates')+'</div></div>'+ed(b+'.desc','p','d','Description',true)+'<div><div class="lbl">Focus areas</div><ul class="bul">'+pts+'</ul></div><div class="ach"><div class="lbl">Achievements</div>'+(E.achievements.length||editing?'<ul class="bul">'+ach+'</ul>':'<p class="empty">Achievements will be listed here as they are earned.</p>')+'</div></div></div></div></section>'}

function certs(){return '<section id="certifications"><div class="wrap"><div class="sec-head"><div class="eyebrow">~/certifications</div><h2>Certifications & learning</h2><p class="lead">Each item shows its real status. A certification only becomes Completed once I have earned it.</p></div><div class="certs">'+S.certs.map(function(c,i){var b='certs.'+i;return '<div class="card cert"><div class="row">'+ed(b+'.name','h3','','Certification name')+status(b+'.status',['Completed','In Progress','Future Goal'])+'</div>'+ed(b+'.note','p','','Note',true)+(editing?'<button class="addb" data-act="rmrow" data-arr="certs" data-i="'+i+'">Remove this item</button>':'')+'</div>'}).join('')+'</div>'+(editing?'<p style="margin-top:16px"><button class="addb" data-act="addcert">+ add certification</button></p>':'')+'</div></section>'}

function lab(){var L=S.lab;return '<section id="lab"><div class="wrap"><div class="sec-head"><div class="eyebrow">~/lab</div><h2>Lab environment</h2></div><div class="flow">'+L.steps.map(function(s,i){return '<div class="fn">'+ed('lab.steps.'+i+'.name','b','','Name')+ed('lab.steps.'+i+'.role','span','','Role')+'</div>'}).join('')+'</div>'+ed('lab.text','p','note','Lab description',true)+'</div></section>'}

function github(){var g=S.github;return '<section id="github"><div class="wrap"><div class="gh"><div><div class="eyebrow">~/github</div><h2>GitHub portfolio</h2>'+ed('github.text','p','','Description',true)+(editing?'<p class="empty" style="margin-top:10px">GitHub link: '+ed('github.url','span','','https://github.com/your-username')+'</p>':'')+'</div><a class="btn primary" href="'+esc(g.url)+'" target="_blank" rel="noopener">Open GitHub</a></div></div></section>'}

function contactRow(key,label){var v=S.contact[key],ph=/your/.test(v);var link=(!editing&&!ph&&key!=='email')?'<a href="'+esc(/^https?:/.test(v)?v:'https://'+v)+'" target="_blank" rel="noopener">'+esc(v)+'</a>':null;
return '<div class="card ct"><div class="lbl">'+label+'</div>'+(link?'<div class="v">'+link+'</div>':ed('contact.'+key,'div','v'+(ph?' ph':''),label))+(editing?'':'<button class="btn" data-act="copy" data-key="'+key+'">Copy</button>')+'</div>'}
function contact(){return '<section id="contact"><div class="wrap"><div class="sec-head"><div class="eyebrow">~/contact</div><h2>Contact</h2><p class="lead">Open to conversations about cybersecurity learning, internships and junior analyst opportunities.</p></div><div class="contacts">'+contactRow('linkedin','LinkedIn')+contactRow('github','GitHub')+contactRow('email','Email')+'</div></div></section>'}

function footer(){return '<footer><div class="wrap">© 2026 '+esc(S.profile.name)+' · Built with care in a home lab</div></footer>'}

function sec(title,p,ph){var v=get(p);if(!editing&&!v)return '<div><h4>'+title+'</h4><p class="empty">'+ph+'</p></div>';return '<div><h4>'+title+'</h4>'+ed(p,'div','prose',ph,true)+'</div>'}
function modal(){if(openIdx<0)return '';var p=S.projects[openIdx],b='projects.'+openIdx,ev=p.detail.evidence;
var evh=ev.map(function(e,i){return '<figure><img src="'+esc(e.src)+'" alt="'+esc(e.caption||'Project evidence')+'">'+ed(b+'.detail.evidence.'+i+'.caption','figcaption','','Caption')+(editing?'<button class="addb" data-act="rmev" data-i="'+i+'">Remove image</button>':'')+'</figure>'}).join('');
return '<div class="ov" data-act="ovclose"><div class="panel" role="dialog" aria-modal="true" aria-label="Project details"><button class="x x-close" data-act="close" aria-label="Close" style="font-size:26px">×</button>'+
'<div><div class="p-top"><span class="p-num">Project '+esc(p.num)+(p.cap?' · Final stage':'')+'</span>'+status(b+'.status',['Planned','In Progress','Completed'])+'</div><h3 style="margin-top:10px">'+ed(b+'.title','span','','Title')+'</h3></div>'+
'<div><h4>Overview</h4>'+ed(b+'.desc','div','prose','Overview',true)+'</div>'+
'<div><div class="lbl">Tools used</div><ul class="chips">'+chips(b+'.tools','m')+'</ul></div>'+
sec('Methodology',b+'.detail.method','The methodology will be added as this project progresses.')+
sec('Findings',b+'.detail.findings','Findings will be added once the work is complete.')+
sec('Lessons learned',b+'.detail.lessons','Lessons learned will be added once the work is complete.')+
'<div><h4>Evidence</h4>'+(ev.length?'<div class="ev">'+evh+'</div>':'<p class="empty">Screenshots and other evidence will be added when available.</p>')+(editing?'<p style="margin-top:12px"><span class="addb filebtn">+ add screenshot<input type="file" accept="image/*" id="evfile" data-act="evfile"></span></p>':'')+'</div></div></div>'}

function bar(){if(!canEdit)return '';return '<div class="bar" role="toolbar" aria-label="Edit portfolio">'+(editing?'<span class="dirty'+(dirty?' on':'')+'" id="dirty">'+(dirty?'Unsaved changes':'No changes')+'</span><button data-act="discard">Discard</button><button class="primary" data-act="save">Publish changes</button><button data-act="edit">Done editing</button>':'<button data-act="edit">Edit portfolio</button>')+'</div>'}

function render(){var y=window.scrollY,ps=app.querySelector('.panel'),pt=ps?ps.scrollTop:0;
app.className=editing?'editing':'';
var hint=editing?'<div class="wrap" style="padding-top:14px"><div class="hint">Edit mode: click any dashed text to change it. Press Publish changes when you are done so visitors see your edits.</div></div>':'';
app.innerHTML=header()+hint+'<main>'+hero()+about()+journey()+projects()+skills()+experience()+certs()+lab()+github()+contact()+'</main>'+footer()+modal()+bar();
app.querySelectorAll('[data-p]').forEach(function(el){if(el.tagName!=='SELECT'){el.contentEditable=editing?'true':'false';el.spellcheck=false}});
document.body.style.overflow=openIdx>=0?'hidden':'';
window.scrollTo(0,y);var np=app.querySelector('.panel');if(np)np.scrollTop=pt}

function markDirty(){dirty=true;var d=document.getElementById('dirty');if(d){d.textContent='Unsaved changes';d.className='dirty on'}}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},3800)}

function shrink(file){return new Promise(function(res,rej){var r=new FileReader();r.onerror=rej;r.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){var s=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.8))};im.src=r.result};r.readAsDataURL(file)})}

function buildDoc(){
var reset=(document.head.querySelector('style:not(#pagecss)')||{}).textContent||'';
var state=JSON.stringify(S).replace(/</g,'\\u003c').split(String.fromCharCode(8232)).join('\\u2028').split(String.fromCharCode(8233)).join('\\u2029');
var stateEl='<script id="state" type="application/json">'+state+'<'+'/script>';
return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
document.querySelector('title').outerHTML+document.getElementById('fontlink').outerHTML+document.getElementById('pagecss').outerHTML+
'<div id="app"></div><div id="toast" role="status" aria-live="polite" hidden></div>'+stateEl+document.getElementById('code').outerHTML+'</body></html>'}

async function save(){
 try{var a=await window.claude.use('artifact');if(!a){toast('Saving is not available in this view.');return}
 toast('Publishing…');await a.publish(buildDoc());toast('Published')}
 catch(e){var c=e&&e.code;if(c==='conflict')return;
  toast(c==='not_writer'||c==='not_granted'?'This view is read-only, so changes cannot be published.':c==='too_large'?'The page is too large. Remove some screenshots and try again.':'Could not publish. Your edits are still here, try again.')}}

app.addEventListener('input',function(e){var t=e.target.closest&&e.target.closest('[data-p]');if(!t||t.tagName==='SELECT')return;var v=t.innerText;if(!t.dataset.ml)v=v.replace(/\n+/g,' ');set(t.dataset.p,v);markDirty()});
app.addEventListener('change',function(e){var t=e.target;if(t.tagName==='SELECT'&&t.dataset.p){set(t.dataset.p,t.value);markDirty();render();return}
 if(t.id==='evfile'&&t.files&&t.files[0]){var f=t.files[0];shrink(f).then(function(src){S.projects[openIdx].detail.evidence.push({src:src,caption:''});markDirty();render()}).catch(function(){toast('That image could not be read.')})}});
app.addEventListener('keydown',function(e){var t=e.target.closest&&e.target.closest('[data-p]');if(t&&editing&&e.key==='Enter'&&!t.dataset.ml){e.preventDefault();t.blur()}});
app.addEventListener('paste',function(e){var t=e.target.closest&&e.target.closest('[data-p]');if(!t||!editing)return;e.preventDefault();var x=(e.clipboardData||window.clipboardData).getData('text');document.execCommand('insertText',false,x)});
app.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;var act=el.dataset.act,i=+el.dataset.i;
 if(act==='ovclose'){if(e.target===el){openIdx=-1;render()}return}
 if(act==='evfile')return;
 if(act==='open'){openIdx=i;render()}
 else if(act==='close'){openIdx=-1;render()}
 else if(act==='edit'){editing=!editing;render()}
 else if(act==='rm'){get(el.dataset.arr).splice(i,1);markDirty();render()}
 else if(act==='add'){get(el.dataset.arr).push(el.dataset.tpl);markDirty();render()}
 else if(act==='rmrow'){S[el.dataset.arr].splice(i,1);markDirty();render()}
 else if(act==='addcert'){S.certs.push({name:'New certification',status:'Future Goal',note:'Add details here.'});markDirty();render()}
 else if(act==='rmev'){S.projects[openIdx].detail.evidence.splice(i,1);markDirty();render()}
 else if(act==='discard'){S=JSON.parse(document.getElementById('state').textContent);dirty=false;render();toast('Changes discarded')}
 else if(act==='save'){save()}
 else if(act==='copy'){var v=S.contact[el.dataset.key];var ok=function(){toast('Copied')};var no=function(){toast('Select the text and copy it manually')};
  try{navigator.clipboard.writeText(v).then(ok,no)}catch(x){no()}}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&openIdx>=0){openIdx=-1;render()}});

render();
(async function(){try{if(!window.claude||!window.claude.use)return;var u=await window.claude.use('user');if(u&&((await u.isOwner())||(await u.canEdit()))){canEdit=true;render()}}catch(e){}})();
})();
</script>
</body>
</html>
